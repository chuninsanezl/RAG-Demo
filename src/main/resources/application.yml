server:
  port: 8080
  tomcat:
    threads:
      max: 300
      min-spare: 30
    accept-count: 1000
    connection-timeout: 5s

spring:
  application:
    name: rag-query-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rag_platform
    username: rag_user
    password: ${DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 3000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: rag-ingest-group
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: manual
      concurrency: 6

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

rag:
  model:
    chat-model: qwen-plus
    embedding-model: text-embedding-v2
  retrieval:
    max-results: 12
    min-score: 0.65
    rerank-top-n: 6
    max-context-tokens: 5000
  chunk:
    max-size: 600
    overlap-size: 80
  cache:
    answer-ttl-minutes: 10
    query-rewrite-ttl-minutes: 30
  degrade:
    enable-keyword-fallback: true
  ingest:
    kafka-enabled: false
  demo:
    load-sample-on-startup: true
    sample-tenant-id: merchant-1001
    sample-user-id: cs-001
    sample-knowledge-base-id: after-sale-kb
    sample-dataset-version: 2026.03

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

resilience4j:
  circuitbreaker:
    instances:
      llmChat:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      embedding:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

  timelimiter:
    instances:
      llmChat:
        timeout-duration: 8s
      embedding:
        timeout-duration: 5s
